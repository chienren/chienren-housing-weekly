name: 更新並發布謙仁房市週報

on:
  schedule:
    - cron: "0 0 * * 1,3,5" # 台北時間 08:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm update:news
      - run: pnpm build:pages
      - name: 儲存最新新聞資料
        run: |
          git config user.name "housing-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: update housing brief"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
